<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mono2Color - Black & White Image Colorizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin-top: 20px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            font-size: 3rem;
            margin-bottom: 10px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-section:hover {
            background: #e9ecef;
            border-color: #764ba2;
            transform: translateY(-2px);
        }

        .upload-section.dragover {
            background: #e7f3ff;
            border-color: #667eea;
        }

        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #667eea;
        }

        .upload-text {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #666;
            font-size: 0.95rem;
        }

        #imageInput {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            display: none;
            margin: 20px auto;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .images-container {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        .image-box {
            text-align: center;
        }

        .image-box h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 1.3rem;
        }

        .image-box img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #e9ecef;
        }

        .loader {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: #667eea;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
            text-align: center;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .images-container {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Mono2Color</h1>
        <p class="subtitle">Transform black & white images into vibrant colors using AI</p>

        <div class="upload-section" id="uploadSection">
            <div class="upload-icon">📸</div>
            <div class="upload-text">Click to upload or drag & drop</div>
            <div class="upload-subtext">Supports JPG, PNG (Max 16MB)</div>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <button class="btn" id="colorizeBtn">✨ Colorize Image</button>

        <div class="success" id="successMsg"></div>
        <div class="error" id="errorMsg"></div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div class="loader-text">Processing your image...</div>
        </div>

        <div class="images-container" id="imagesContainer">
            <div class="image-box">
                <h3>Original Image</h3>
                <img id="originalImg" src="" alt="Original">
            </div>
            <div class="image-box">
                <h3>Colorized Image</h3>
                <img id="colorizedImg" src="" alt="Colorized">
            </div>
        </div>
    </div>

    <script>
        const uploadSection = document.getElementById('uploadSection');
        const imageInput = document.getElementById('imageInput');
        const colorizeBtn = document.getElementById('colorizeBtn');
        const loader = document.getElementById('loader');
        const imagesContainer = document.getElementById('imagesContainer');
        const originalImg = document.getElementById('originalImg');
        const colorizedImg = document.getElementById('colorizedImg');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        let selectedFile = null;

        // Click to upload
        uploadSection.addEventListener('click', () => {
            imageInput.click();
        });

        // Drag and drop
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFileSelect(file);
            }
        });

        // File input change
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFileSelect(file);
            }
        });

        function handleFileSelect(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                originalImg.src = e.target.result;
                colorizeBtn.style.display = 'block';
                imagesContainer.style.display = 'none';
                colorizedImg.src = '';
                errorMsg.style.display = 'none';
                
                // Show success message
                successMsg.textContent = '✅ Image uploaded successfully! Click "Colorize Image" to process.';
                successMsg.style.display = 'block';
                
                // Hide success message after 3 seconds
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 3000);
            };
            reader.readAsDataURL(file);
        }

        // Colorize button
        colorizeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);

            colorizeBtn.disabled = true;
            loader.style.display = 'block';
            imagesContainer.style.display = 'none';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            try {
                const response = await fetch('/colorize', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Failed to colorize image');
                }

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                colorizedImg.src = url;
                imagesContainer.style.display = 'grid';
            } catch (error) {
                errorMsg.textContent = '❌ Error: ' + error.message;
                errorMsg.style.display = 'block';
            } finally {
                loader.style.display = 'none';
                colorizeBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
